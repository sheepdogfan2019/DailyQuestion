<html lang="en">
<head>
<meta charset="UTF-8">

<title>Question of the Day</title>

<style>
:root {
  --bg: #fdf6ec;
  --card: #ffffff;
  --ink: #2b2320;
  --sub: #7a6f65;
  --accent: #ff6b6b;
  --accent2: #4ecdc4;
  --accent3: #ffd93d;
  --accent4: #a78bfa;
  --border: #eadfce;
  --shadow: 0 8px 24px rgba(60,40,20,0.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171310;
    --card: #221d19;
    --ink: #f3ece2;
    --sub: #b7a99a;
    --border: #33291f;
    --shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  min-height: 100%;
}
body {
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  overflow-x: hidden;
}
.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding: 20px 18px 60px;
}
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--bg);
  padding: 10px 0 14px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  margin-bottom: 22px;
}
.topbar h1 {
  font-size: 1.3rem;
  margin: 0 0 8px;
  letter-spacing: -0.02em;
}
.counter {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 6px 16px;
  font-size: 0.85rem;
  color: var(--sub);
  box-shadow: var(--shadow);
}
.counter b { color: var(--ink); font-size: 0.95rem; }
.counter-bar {
  width: 90px;
  height: 6px;
  border-radius: 999px;
  background: var(--border);
  overflow: hidden;
}
.counter-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent4));
  transition: width 0.6s ease;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 28px 22px;
  box-shadow: var(--shadow);
  text-align: center;
  margin-bottom: 20px;
  animation: fadein 0.4s ease;
}
.card.reveal-zoom {
  animation: zoomReveal 0.55s cubic-bezier(.2,.8,.3,1.1);
}
@keyframes fadein { from { opacity:0; transform: translateY(6px);} to {opacity:1; transform:none;} }
@keyframes zoomReveal {
  0%   { opacity: 0; transform: scale(0.35); }
  60%  { opacity: 1; transform: scale(1.06); }
  100% { opacity: 1; transform: scale(1); }
}
.stage-label {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--sub);
  font-weight: 600;
  margin-bottom: 6px;
}
.big-line {
  font-size: 1.15rem;
  font-weight: 600;
  margin: 6px 0 18px;
  line-height: 1.4;
}
.big-line .name {
  color: var(--accent);
}

/* --- Coin --- */
.coin-zone {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
.coin-stage-3d {
  perspective: 800px;
  width: 130px;
  height: 130px;
  margin: 6px auto 4px;
}
.coin {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.15s linear;
}
.coin.flipping {
  animation: flipcoin 1.6s cubic-bezier(.2,.6,.3,1) forwards;
}
@keyframes flipcoin {
  0%   { transform: rotateY(0deg) translateY(0); }
  15%  { transform: rotateY(720deg) translateY(-40px); }
  40%  { transform: rotateY(1800deg) translateY(-55px); }
  70%  { transform: rotateY(2880deg) translateY(-10px); }
  100% { transform: rotateY(var(--final-rot)) translateY(0); }
}
.coin-face {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.4rem;
  font-weight: 800;
  backface-visibility: hidden;
  box-shadow: inset 0 0 0 6px rgba(0,0,0,0.08), 0 6px 14px rgba(0,0,0,0.2);
  color: #5b4300;
}
.coin-face.heads { background: radial-gradient(circle at 35% 30%, #ffe98a, #f6c945 70%); }
.coin-face.tails { background: radial-gradient(circle at 35% 30%, #cfe9ff, #8fbfe6 70%); transform: rotateY(180deg); }
.call-buttons {
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
}
.btn {
  border: none;
  border-radius: 14px;
  padding: 14px 26px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  color: white;
  box-shadow: 0 4px 0 rgba(0,0,0,0.15);
  transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.2s ease;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-heads { background: linear-gradient(135deg,#ffb347,#ff6b6b); }
.btn-tails { background: linear-gradient(135deg,#4ecdc4,#4a90e2); }
.btn-spin { background: linear-gradient(135deg,#a78bfa,#ff6b6b); font-size: 1.05rem; padding: 16px 34px; }
.btn-spin.is-spinning { background: linear-gradient(135deg,#ff6b6b,#ffd93d); animation: pulseStop 1s ease-in-out infinite; }
@keyframes pulseStop {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.045); }
}
.btn-reset { background: transparent; color: var(--sub); box-shadow: none; font-size: 0.75rem; padding: 6px 10px; text-decoration: underline; font-weight: 500; }

.result-pill {
  display: inline-block;
  margin-top: 6px;
  padding: 6px 14px;
  border-radius: 999px;
  background: var(--border);
  font-size: 0.85rem;
  font-weight: 600;
}

/* --- Wheel --- */
.wheel-zone {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}
.wheel-pointer {
  width: 0; height: 0;
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-top: 20px solid var(--ink);
  margin-bottom: -6px;
  z-index: 2;
  filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
}
.wheel-outer {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  border: 6px solid var(--card);
  box-shadow: 0 0 0 4px var(--border), var(--shadow);
  position: relative;
  overflow: hidden;
  transition: transform 0.5s cubic-bezier(.3,0,.7,1), opacity 0.5s ease;
}
.wheel-outer.wheel-zoom-out {
  transform: scale(2.4);
  opacity: 0;
}
.wheel-disc {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    #ff6b6b 0deg 7.2deg, #ffd93d 7.2deg 14.4deg, #4ecdc4 14.4deg 21.6deg, #a78bfa 21.6deg 28.8deg,
    #ff8fab 28.8deg 36deg, #6bcb77 36deg 43.2deg, #ffa06b 43.2deg 50.4deg,
    #6ba3ff 50.4deg 57.6deg, #ff6bd6 57.6deg 64.8deg, #ff6b6b 64.8deg 72deg, #ffd93d 72deg 79.2deg,
    #4ecdc4 79.2deg 86.4deg, #a78bfa 86.4deg 93.6deg, #ff8fab 93.6deg 100.8deg, #6bcb77 100.8deg 108deg,
    #ffa06b 108deg 115.2deg, #6ba3ff 115.2deg 122.4deg, #ff6bd6 122.4deg 129.6deg, #ff6b6b 129.6deg 136.8deg,
    #ffd93d 136.8deg 144deg, #4ecdc4 144deg 151.2deg, #a78bfa 151.2deg 158.4deg, #ff8fab 158.4deg 165.6deg,
    #6bcb77 165.6deg 172.8deg, #ffa06b 172.8deg 180deg, #6ba3ff 180deg 187.2deg, #ff6bd6 187.2deg 194.4deg,
    #ff6b6b 194.4deg 201.6deg, #ffd93d 201.6deg 208.8deg, #4ecdc4 208.8deg 216deg, #a78bfa 216deg 223.2deg,
    #ff8fab 223.2deg 230.4deg, #6bcb77 230.4deg 237.6deg, #ffa06b 237.6deg 244.8deg, #6ba3ff 244.8deg 252deg,
    #ff6bd6 252deg 259.2deg, #ff6b6b 259.2deg 266.4deg, #ffd93d 266.4deg 273.6deg, #4ecdc4 273.6deg 280.8deg,
    #a78bfa 280.8deg 288deg, #ff8fab 288deg 295.2deg, #6bcb77 295.2deg 302.4deg, #ffa06b 302.4deg 309.6deg,
    #6ba3ff 309.6deg 316.8deg, #ff6bd6 316.8deg 324deg, #ff6b6b 324deg 331.2deg, #ffd93d 331.2deg 338.4deg,
    #4ecdc4 338.4deg 345.6deg, #a78bfa 345.6deg 352.8deg, #ff8fab 352.8deg 360deg
  );
  position: relative;
}
.wheel-disc.spinning {
  animation: wheelSpinLoop 0.7s linear infinite;
}
@keyframes wheelSpinLoop {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
.wheel-disc.decelerating {
  transition: transform 1.6s cubic-bezier(.12,.67,.2,1);
}
.wheel-disc::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: repeating-conic-gradient(rgba(0,0,0,0.05) 0deg 1.8deg, transparent 1.8deg 3.6deg);
}
.wheel-hub {
  position: absolute;
  top: 50%; left: 50%;
  width: 44px; height: 44px;
  transform: translate(-50%,-50%);
  background: var(--card);
  border-radius: 50%;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem;
}
.wheel-caption {
  font-size: 0.8rem;
  color: var(--sub);
}

/* --- Question reveal --- */
.tag {
  display: inline-block;
  padding: 5px 14px;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 14px;
  color: white;
}
.tag.wyr { background: var(--accent); }
.tag.scen { background: var(--accent4); }
.question-text {
  font-size: 1.3rem;
  font-weight: 700;
  line-height: 1.45;
  margin: 4px 0 10px;
}
.done-footer {
  margin-top: 18px;
  font-size: 0.85rem;
  color: var(--sub);
}
.mini-note {
  font-size: 0.78rem;
  color: var(--sub);
  margin-top: 10px;
}
.footer-links {
  text-align: center;
  margin-top: 30px;
  font-size: 0.78rem;
  color: var(--sub);
}
.loading-dots::after {
  content: '.';
  animation: dots 1.2s steps(4,end) infinite;
}
@keyframes dots {
  0%,20% {content:'.';} 40% {content:'..';} 60%,100% {content:'...';}
}
.confetti-piece {
  position: fixed;
  top: -10px;
  width: 8px; height: 14px;
  opacity: 0.9;
  z-index: 999;
  animation: fall linear forwards;
}
@keyframes fall {
  to { transform: translateY(110vh) rotate(540deg); opacity: 0.3; }
}
</style>
</head>

:"Guess the Outcome","t":"Guess: what year was the first Super Bowl played?"},{"c":"Guess the Outcome","t":"Guess: what year did color television become widely available in homes?"},{"c":"Guess the Outcome","t":"Guess: what's the population of Japan, roughly?"},{"c":"Guess the Outcome","t":"Guess: what's the total population of Africa, roughly?"},{"c":"Guess the Outcome","t":"Guess: roughly how many people live in New York City proper?"},{"c":"Guess the Outcome","t":"Guess: how many people visit the Eiffel Tower every year?"},{"c":"Guess the Outcome","t":"Quick fire: mornings or nights? (answer in under 2 seconds, no overthinking)"},{"c":"Guess the Outcome","t":"Quick fire: summer or winter? (answer in under 2 seconds, no overthinking)"},{"c":"Guess the Outcome","t":"Quick fire: the beach or the mountains? (answer in under 2 seconds, no overthinking)"},{"c":"Guess the Outcome","t":"Quick fire: cats or dogs? (answer in under 2 seconds, no overthinking)"},{"c":"Guess the Outcome","t":"Quick fire: texting or calling? (answer in under 2 seconds, no overthinking)"},{"c":"Guess the Outcome","t":"Quick fire: board games or video games? (answer in under 2 seconds, no overthinking)"},{"c":"Guess the Outcome","t":"Quick fire: introvert energy or extrovert energy? (answer in under 2 seconds, no overthinking)"},{"c":"Guess the Outcome","t":"Quick fire: sweet or salty? (answer in under 2 seconds, no overthinking)"},{"c":"Guess the Outcome","t":"Quick fire: the city or the countryside? (answer in under 2 seconds, no overthinking)"},{"c":"Guess the Outcome","t":"Quick fire: planning ahead or winging it? (answer in under 2 seconds, no overthinking)"},{"c":"Guess the Outcome","t":"Quick fire: being early or being fashionably late? (answer in under 2 seconds, no overthinking)"},{"c":"Guess the Outcome","t":"Quick fire: window seat or aisle seat? (answer in under 2 seconds, no overthinking)"},{"c":"Guess the Outcome","t":"Quick fire: coffee or tea? (answer in under 2 seconds, no overthinking)"},{"c":"Guess the Outcome","t":"Quick fire: read the book first or watch the movie first? (answer in under 2 seconds, no overthinking)"}];
const TOTAL = QUESTIONS.length;
const NAMES = ["Jas", "Lan"];
const STORAGE_KEY = "qotd_state_v2";

function todayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function pickUnused(used) {
  const usedSet = new Set(used);
  const pool = [];
  for (let i=0;i<TOTAL;i++) if (!usedSet.has(i)) pool.push(i);
  if (pool.length === 0) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

function tagInfo(cat) {
  if (cat === "Would You Rather") return {cls:"wyr", label:"Would You Rather"};
  return {cls:"scen", label:"Guess the Outcome"};
}

function launchConfetti() {
  const colors = ["#ff6b6b","#ffd93d","#4ecdc4","#a78bfa","#ff8fab"];
  for (let i=0;i<28;i++) {
    const el = document.createElement("div");
    el.className = "confetti-piece";
    el.style.left = Math.random()*100+"vw";
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (2+Math.random()*1.5)+"s";
    el.style.transform = "rotate("+Math.floor(Math.random()*360)+"deg)";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4000);
  }
}

/* ---------- Persistence: localStorage (this device only) ---------- */
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}
function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* storage full/blocked - carry on in memory */ }
}

let currentState = null;
let localBusy = false; // prevents double-click races while an animation/write is in flight

function renderCounter(used) {
  const n = used.length;
  document.getElementById("countText").textContent = n + " / " + TOTAL;
  document.getElementById("countFill").style.width = Math.min(100,(n/TOTAL)*100) + "%";
}

function renderNeedCall(state) {
  const caller = state.caller;
  document.getElementById("app").innerHTML = `
    <div class="card">
      <div class="stage-label">Coin Toss</div>
      <div class="big-line">It's <span class="name">${caller}</span>'s turn to call it in the air!</div>
      <div class="coin-zone">
        <div class="coin-stage-3d"><div class="coin" id="coin">
          <div class="coin-face heads">H</div>
          <div class="coin-face tails">T</div>
        </div></div>
        <div class="call-buttons">
          <button class="btn btn-heads" id="callHeads">Call Heads</button>
          <button class="btn btn-tails" id="callTails">Call Tails</button>
        </div>
        <div class="mini-note">Tap for ${caller}. The other side of the couch has to trust the honor system 😄</div>
      </div>
    </div>`;
  document.getElementById("callHeads").onclick = () => doCoinFlip("heads");
  document.getElementById("callTails").onclick = () => doCoinFlip("tails");
}

function doCoinFlip(guess) {
  if (localBusy) return;
  localBusy = true;
  const result = Math.random() < 0.5 ? "heads" : "tails";
  const winner = (guess === result) ? currentState.caller : NAMES.find(n => n !== currentState.caller);
  const coinEl = document.getElementById("coin");
  const finalRot = result === "heads" ? "2880deg" : "3060deg"; // 3060 = 2880+180 lands on tails face
  coinEl.style.setProperty("--final-rot", finalRot);
  document.getElementById("callHeads").disabled = true;
  document.getElementById("callTails").disabled = true;
  coinEl.classList.add("flipping");
  setTimeout(() => {
    const next = Object.assign({}, currentState, {
      stage: "flipped",
      callerGuess: guess,
      coinResult: result,
      winner: winner
    });
    currentState = next;
    saveState(next);
    renderFlipped(next);
    renderCounter(next.usedIndices || []);
    localBusy = false;
  }, 1650);
}

function renderFlipped(state) {
  const correct = state.callerGuess === state.coinResult;
  document.getElementById("app").innerHTML = `
    <div class="card">
      <div class="stage-label">Coin Toss Result</div>
      <div class="coin-stage-3d"><div class="coin" style="transform: rotateY(${state.coinResult==='heads'?'0deg':'180deg'})">
        <div class="coin-face heads">H</div>
        <div class="coin-face tails">T</div>
      </div></div>
      <div class="result-pill">It landed on ${state.coinResult.toUpperCase()}</div>
      <div class="big-line" style="margin-top:14px;">${state.caller} called ${state.callerGuess} — ${correct ? "nailed it! 🎯" : "nope! 😅"}<br><span class="name">${state.winner}</span> gets to spin the wheel!</div>
      <div class="wheel-zone">
        <div class="wheel-pointer"></div>
        <div class="wheel-outer" id="wheelOuter"><div class="wheel-disc" id="wheelDisc"><div class="wheel-hub">🎯</div></div></div>
        <button class="btn btn-spin" id="spinBtn">Spin for ${state.winner}!</button>
        <div class="wheel-caption" id="wheelCaption">${TOTAL} slices. Spin it, then tap Stop whenever you dare. No repeats.</div>
      </div>
    </div>`;
  document.getElementById("spinBtn").onclick = startSpin;
}

/* Reads the wheel disc's current animated rotation (deg) mid-spin by
   decomposing the live CSS transform matrix - lets us hand off smoothly
   from the fast infinite spin into a decelerating stop. */
function getCurrentRotationDeg(el) {
  const style = getComputedStyle(el);
  const t = style.transform;
  if (!t || t === "none") return 0;
  const m = t.match(/matrix\(([^)]+)\)/);
  if (!m) return 0;
  const parts = m[1].split(",").map(Number);
  const a = parts[0], b = parts[1];
  let deg = Math.atan2(b, a) * (180 / Math.PI);
  if (deg < 0) deg += 360;
  return deg;
}

let spinning = false;

function startSpin() {
  if (localBusy || spinning) return;
  spinning = true;
  const disc = document.getElementById("wheelDisc");
  const btn = document.getElementById("spinBtn");
  const caption = document.getElementById("wheelCaption");
  disc.classList.add("spinning");
  btn.textContent = "Stop!";
  btn.classList.add("is-spinning");
  caption.textContent = "Spinning... tap Stop whenever you're ready!";
  // brief grace period so a reflex tap doesn't stop it with zero drama
  btn.disabled = true;
  setTimeout(() => { btn.disabled = false; }, 550);
  btn.onclick = stopSpin;
}

function stopSpin() {
  if (!spinning) return;
  spinning = false;
  localBusy = true;
  const disc = document.getElementById("wheelDisc");
  const btn = document.getElementById("spinBtn");
  const caption = document.getElementById("wheelCaption");
  btn.disabled = true;
  btn.classList.remove("is-spinning");

  // freeze the live spin at its current angle, then hand off to a
  // decelerating transition that settles on a random final angle
  const currentDeg = getCurrentRotationDeg(disc);
  disc.classList.remove("spinning");
  disc.style.transition = "none";
  disc.style.transform = `rotate(${currentDeg}deg)`;
  disc.offsetHeight; // force reflow so the above takes effect before we animate again

  const extraTurns = 3 + Math.floor(Math.random()*2); // 3-4 more turns while decelerating
  const finalOffset = Math.floor(Math.random()*360);
  const targetDeg = currentDeg + extraTurns*360 + finalOffset;

  requestAnimationFrame(() => {
    disc.classList.add("decelerating");
    disc.style.transform = `rotate(${targetDeg}deg)`;
  });

  caption.textContent = "Slowing down...";

  setTimeout(() => {
    // the wheel has settled - pick the question and zoom in on the reveal
    const used = currentState.usedIndices || [];
    const idx = pickUnused(used);
    const newUsed = idx === null ? used : used.concat([idx]);
    const next = Object.assign({}, currentState, {
      stage: "done",
      questionIndex: idx,
      usedIndices: newUsed
    });
    currentState = next;
    saveState(next);

    const wheelOuter = document.getElementById("wheelOuter");
    if (wheelOuter) wheelOuter.classList.add("wheel-zoom-out");
    if (btn) btn.style.opacity = "0";
    if (caption) caption.style.opacity = "0";

    setTimeout(() => {
      renderDone(next);
      renderCounter(next.usedIndices || []);
      localBusy = false;
      launchConfetti();
    }, 480);
  }, 1650);
}

function renderDone(state) {
  if (state.questionIndex === null || state.questionIndex === undefined) {
    document.getElementById("app").innerHTML = `<div class="card reveal-zoom"><div class="big-line">🎉 You two have somehow used all ${TOTAL} questions!</div><div class="mini-note">Time to write a sequel.</div></div>`;
    return;
  }
  const q = QUESTIONS[state.questionIndex];
  const info = tagInfo(q.c);
  document.getElementById("app").innerHTML = `
    <div class="card reveal-zoom">
      <span class="tag ${info.cls}">${info.label}</span>
      <div class="question-text">${q.t}</div>
      <div class="done-footer">🏆 ${state.winner} called it and spun today's question.<br>Come back tomorrow for a new toss — it'll be ${NAMES.find(n=>n!==state.caller)}'s turn to call.</div>
    </div>`;
}

function render(state) {
  currentState = state;
  renderCounter(state.usedIndices || []);
  if (!state.stage || state.stage === "need_call") renderNeedCall(state);
  else if (state.stage === "flipped") renderFlipped(state);
  else if (state.stage === "done") renderDone(state);
}

function rolloverIfNewDay(state) {
  const today = todayKey();
  if (state.day === today) return state;
  const prevCaller = state.caller || "Lan"; // so first-ever day defaults to Jas
  const nextCaller = NAMES.find(n => n !== prevCaller);
  return {
    day: today,
    caller: nextCaller,
    stage: "need_call",
    callerGuess: null,
    coinResult: null,
    winner: null,
    questionIndex: null,
    usedIndices: state.usedIndices || []
  };
}

function init() {
  let state = loadState();
  if (!state) {
    state = {
      day: todayKey(),
      caller: "Jas",
      stage: "need_call",
      callerGuess: null,
      coinResult: null,
      winner: null,
      questionIndex: null,
      usedIndices: []
    };
    saveState(state);
  } else {
    state = rolloverIfNewDay(state);
    saveState(state);
  }
  render(state);

  document.getElementById("resetBtn").onclick = () => {
    if (!confirm("Reset all progress on this device? This clears which questions have been used and today's result.")) return;
    localStorage.removeItem(STORAGE_KEY);
    init();
  };
}

init();
</script>
